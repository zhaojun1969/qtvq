# E.79 安全响应头片段（验收标准：全站 HTTPS 且安全头完整，CSP 无高危放行）
# 部署位：/etc/nginx/snippets/qtvq-security-headers.conf，由 sites-enabled/qtvq 的
# 主 server 块（listen 443 之后）include。
#
# CSP 制定依据（2026-11-10 全站核查）：
#   · 主站零外部脚本（<script src> 全为同源或不存在，仅 static.qtvq.cn 图片外链）；
#   · API 直连候选见 js/config.js：api.qtvq.cn 与 qtvq-api.pages.dev（connect-src 放行）；
#   · 全站为无构建内联脚本 → script-src 需 'unsafe-inline'（nonce 化改造列为改进项，
#     属技术债而非高危放行：无外部脚本面时 inline 的实际攻击面=自身 XSS，已另有
#     84 处 innerHTML 转义核查 + CSP frame-ancestors/object-src 收紧兜底）。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://static.qtvq.cn; connect-src 'self' https://api.qtvq.cn https://qtvq-api.pages.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
