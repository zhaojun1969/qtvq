# E.84/E.96 www 统一 301 到主域（避免双域重复收录与权重分散）
#
# E.96 修正：原 server 级 `return 301` 在 rewrite 阶段先于 location 匹配执行，
# 会把验证文件/robots/sitemap 也卷进跳转（百度文件验证因 301 失败，2026-11-13 实测）。
# 修正后：跳转降级为 catch-all location；基础设施文件（验证/robots/sitemap/llms）
# 独立 location 200 直出——爬虫在任一域名变体上都能直接取到，跳转只作用于内容页。

server {
    listen 80;
    server_name www.qtvq.cn;

    location ~ ^/(baidu_verify_[^/]+\.html|robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        root /var/www/qtvq;
    }

    location / {
        return 301 https://qtvq.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.qtvq.cn;
    ssl_certificate /etc/letsencrypt/live/qtvq.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qtvq.cn/privkey.pem;
    include /etc/nginx/snippets/qtvq-security-headers.conf;

    location ~ ^/(baidu_verify_[^/]+\.html|robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$ {
        root /var/www/qtvq;
    }

    location / {
        return 301 https://qtvq.cn$request_uri;
    }
}
