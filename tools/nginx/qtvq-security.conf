# Q问 · nginx 安全加固（放到 /etc/nginx/conf.d/qtvq-security.conf）
#
# 目标：挡住逆向爬虫、扫描器、饱和攻击与常见入侵探测；同时**不误伤**：
#   · 已放行的搜索引擎（百度/360/神马/Google/Bing）—— 见 qtvq-crawlers.geo.conf；
#   · 自己的部署与监控（curl / Node undici）—— 见下方"为什么不封 curl 与 undici"；
#   · 站内正常用户（含微信内置浏览器）。
#
# 三条刻意的取舍（写在这里，免得以后有人"顺手改回去"）：
#   1. **用 444 而不是 403**：444 是 nginx 直接断连、不发任何响应 ——
#      对扫描器省带宽，也不告诉对方"这个路径存在"。
#   2. **UA 伪造防护用"官方 IP 段白名单"，不是每次请求做 rDNS**：
#      nginx 在请求路径上做不了 rDNS；把 DNS 查询放进每请求链路会拖慢线上，
#      还会让上游 DNS 抖动直接影响可用性。工业做法是定期同步官方发布名单
#      （Google 有 googlebot.json），见 tools/scripts/sync-crawler-ips.mjs。
#   3. **不做全站限速**：只对 /api/ /v1/ 加漏桶，静态页不限速 —— 否则用户连续翻几页就被误伤。
#
# 为什么**不封** curl / wget / Node 的 undici：
#   本项目的部署脚本、体检脚本（tools/scripts/*.mjs）全都用它们访问线上。
#   封掉等于把自己锁在门外 —— 这类"安全措施把运维搞挂"的事故很常见。
#   它们改为受 /api/ 限速约束 + 记入滥用日志。
#   同理 okhttp/Java/axios/node-fetch 不硬封：它们也可能是正常的 API 客户端；
#   **只封"绝无可能是正常浏览器"的**（爬虫框架、扫描器、抓包/逆向工具、空 UA）。

# ─────────────────────────── 限流区（饱和攻击防护） ───────────────────────────
limit_req_zone $binary_remote_addr zone=qtvq_api:10m  rate=20r/s;  # 普通接口
limit_req_zone $binary_remote_addr zone=qtvq_dyn:10m  rate=10r/s;   # 下单/生成报告等重接口
limit_req_zone $binary_remote_addr zone=qtvq_auth:10m rate=5r/s;   # 登录/短信/举报等可被刷的接口
limit_conn_zone $binary_remote_addr zone=qtvq_conn:10m;            # 单 IP 并发连接

# 命中限速返回 429（不是 503）：前端能识别为"太快了"，fail2ban 也能据此封禁
limit_req_status 429;
limit_conn_status 429;

# ─────────────────────────── 恶意 UA：硬封（绝无可能是正常浏览器） ───────────────────────────
map $http_user_agent $qtvq_bad_ua {
    default 0;

    # 爬虫框架与脚本 HTTP 库
    "~*(python-requests|python-urllib|aiohttp|httpx)" 1;
    "~*(scrapy|Scrapy)"                               1;
    "~*(libwww-perl|LWP::Simple|WWW-Mechanize)"       1;
    "~*(PhantomJS|HeadlessChrome)"                    1;

    # 扫描器 / 漏洞利用工具
    "~*(sqlmap|nikto|nmap|masscan|nessus|acunetix|w3af)" 1;
    "~*(dirbuster|gobuster|wfuzz|ffuf|nuclei)"           1;

    # 抓包 / 逆向 / 中间人
    "~*(mitmproxy|Charles|Fiddler|BurpSuite|Burp|OWASP ZAP|ZAP/)" 1;
    "~*(IDA|Ghidra|jadx|apktool)"                                1;

    # 逆向抓取类（用户点名要挡的 READ 之类工具的自报头）
    "~*(READ|readonly|rev-eng|reverse-engineering|scraper)" 1;

    # 空 UA：正常浏览器一定带 UA，空 UA 基本是脚本
    ""  1;
}

# ─────────────────────────── 自称搜索引擎，但需 IP 校验 ───────────────────────────
map $http_user_agent $qtvq_claims_crawler {
    default 0;
    "~*(Baiduspider|baidu\.com)"                        1;
    "~*(Googlebot|Google-InspectionTool|AdsBot-Google)" 1;
    "~*(bingbot|msnbot|BingPreview)"                    1;
    "~*(Sogou web spider|Sogou inst spider)"            1;
    "~*(360Spider|HaoSouSpider)"            1;
    "~*(YandexBot|DuckDuckBot|Applebot)"                1;
}

# 组合判定：自称爬虫(1) 且 IP 不在白名单(0) → 伪装爬虫。
# 为什么用一个 map 拼 key 而不是嵌套 if：nginx **不允许 if 里再嵌 if**，
# 这个 "a:b" 拼 key 的写法是官方推荐的等价做法。
map "$qtvq_claims_crawler:$qtvq_crawler_ok" $qtvq_fake_crawler {
    default 0;
    "1:0"   1;
}

# ─────────────────────────── 蜜罐：常见入侵探测路径 ───────────────────────────
# 这些路径本项目**根本不存在**，正常用户也绝不可能访问；命中即 444 并单独记日志。
map $request_uri $qtvq_honeypot {
    default 0;
    "~*(/\.git|/\.svn|/\.env|/\.aws|/\.ssh|/\.DS_Store)"   1;
    "~*(/wp-admin|/wp-login|/xmlrpc\.php|/wp-content|/wp-includes)" 1;
    "~*(/phpmyadmin|/pma|/myadmin|/adminer|/dbadmin)"      1;
    "~*(/phpinfo|/info\.php|/test\.php|/shell\.php|/cmd\.php)" 1;
    "~*(/cgi-bin/|/\.htaccess|/web\.config|/config\.php)"  1;
    "~*(/actuator|/druid|/swagger|/api-docs|/v2/api-docs)" 1;
    "~*(/etc/passwd|/proc/self|/\.\./)"                    1;
    "~*(/vendor/phpunit|/laravel|/thinkphp|/struts|/solr)" 1;
}

# ─────────────────────────── 日志 ───────────────────────────
# 带判定字段的自定义格式：fail2ban 与告警脚本都靠它识别"被处置的请求"。
log_format qtvq_security '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'ua_bad=$qtvq_bad_ua honeypot=$qtvq_honeypot fake_crawler=$qtvq_fake_crawler';

map $qtvq_bad_ua $qtvq_is_abuse {
    default 0;
    1       1;
}

# 恶意请求单独落一个文件：便于 fail2ban 精确封禁，也便于每天扫一眼。
# 注意：map 必须在 access_log 之前定义（nginx 按解析顺序求值）。
access_log /var/log/nginx/qtvq-abuse.log qtvq_security if=$qtvq_is_abuse;
