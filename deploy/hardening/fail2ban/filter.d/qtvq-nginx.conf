# fail2ban filter：识别 Q问 nginx 的"被处置请求"
#
# 匹配四类：
#   1. 状态码 429（限速命中）/ 444（我们主动断连的恶意请求）；
#   2. 自定义 abuse 日志里的判定字段（ua_bad=1 / honeypot=1 / fake_crawler=1）——
#      **哪怕返回 200 也应封**，因为命中说明对方在扫描或伪装爬虫。
#
# ⚠️ 两个必须记住的坑（都实际踩过）：
#
#   ① **不要用内置的 nginx-http-auth / nginx-botsearch**：它们主要认 401/403，
#      而本项目用 429/444（444 是我们主动断连），内置 filter 完全不认。
#      直接复用的后果是"看起来配了 fail2ban，实际一次都不封"—— 假安全比没有更危险。
#
#   ② **failregex 里不要写反斜杠转义**（`\[`、`\]`、`\s`、`\d` 等）：
#      fail2ban 在把 `<HOST>` 替换成 host 正则后编译整条表达式，
#      **编译失败的那条会被静默丢弃** —— `fail2ban-regex` 只显示 `Failregex: 0 total`，
#      没有任何报错。2026-10-11 实测：写成 `^<HOST> - - \[[^\]]+\] …` 时 0 条生效，
#      改成下面这种无反斜杠写法后 6 条全部匹配。
#      所以本文件**刻意只用字面字符与 `.*`**：精度靠"我们自己的 abuse 日志字段"保证，
#      而不是靠复杂正则。
#
# 自测（装完必跑，应看到 Failregex ≥ 4 且 Matched ≥ 1）：
#   sudo fail2ban-regex /var/log/nginx/qtvq-abuse.log qtvq-nginx

[Definition]

failregex = ^<HOST> - - .*" (?:429|444) [0-9]+
            ^<HOST> - - .*ua_bad=1
            ^<HOST> - - .*honeypot=1
            ^<HOST> - - .*fake_crawler=1

ignoreregex =
