# 蜜罐专用过滤器（2026-10-26 从 qtvq-nginx.conf 拆分出来）
#
# 为什么拆：原过滤器把 **429（限流）** 也算作攻击信号。
# 429 恰恰是"网络慢 → 客户端重试/重连"时最容易产生的响应 ——
# 于是出现自我强化的误封：链路慢 → 重试 → 429 → 封禁 24h → 超时 → 更多重试。
# 2026-10-26 实测：测试 IP 被 qtvq-honeypot 与 qtvq-nginx 同时封禁，
# 表现是整站"连接超时"（iptables DROP），排查时极易误判为网络故障。
#
# 本过滤器只匹配**真正的攻击信号**：蜜罐路径、恶意 UA、伪装爬虫、隐藏文件（444）。
# 限流（429）交给 qtvq-nginx.conf，并且阈值放得很高（见 jail.d/qtvq.local）。

[Definition]

failregex = ^<HOST> - - .*" 444 [0-9]+
            ^<HOST> - - .*ua_bad=1
            ^<HOST> - - .*honeypot=1
            ^<HOST> - - .*fake_crawler=1

ignoreregex =
