# 被封禁 IP 的判定（2026-10-26 新增，配合 /usr/local/bin/qtvq-blocklist-sync）
#
# 目的：让被 fail2ban 封禁的客户端收到**明确的 429**，而不是 iptables DROP 造成的
# "连接超时" —— 后者与网络故障在客户端完全无法区分，用户只看到"打不开"，
# 运维也只能靠猜（2026-10-26 我本人就因此误判了一轮，见质量提升方案附录 E.18）。
#
# 名单文件 `blacklisted-sessions.map` 由 systemd 定时器每 60 秒从 fail2ban 同步：
#   每行形如 `1.2.3.4 1;`
# 同步脚本：/usr/local/bin/qtvq-blocklist-sync
map $remote_addr $qtvq_blocked {
    default 0;
    include /etc/nginx/blacklisted-sessions.map;
}
