# ============================================================================
# Q问 · 站点主配置（/etc/nginx/sites-enabled/qtvq）的**仓库副本**
#
# 2026-10-26 起纳入版本库。此前这份配置只存在于服务器上：
#   · `deploy/hardening/nginx/*.conf` 只覆盖 conf.d 片段与 server 片段；
#   · 站点 server 块本身（location /、/v1/、/api/、缓存策略等）没有仓库副本，
#     改动只能"直接上服务器 + 备份到 /root"，无法 review、无法回滚到仓库版本。
#
# 这个副本的定位是**可读的快照 + 审查基线**，不是自动部署源：
#   · 刷新：`powershell -File tools/scripts/pull-site-config.ps1`
#   · 比对：同上加 `-Diff`
#   · 部署仍走 `deploy/hardening/install.sh`（它负责装 conf.d 片段与 server 片段，
#     并对站点文件先备份、`nginx -t` 通过后才 reload）
#
# 注意：文件里的 `# ===== QTVQ HARDENING ... =====` 段是 install.sh **插入**的，
# 直接手改这份副本里的该段没有意义 —— 要改就改
# `deploy/hardening/nginx/qtvq-server-snippet.conf`，再跑 install.sh。
# ============================================================================
server {
    server_name qtvq.cn www.qtvq.cn;
    root /var/www/qtvq;
    index index.html;


    # ===== 被封禁 IP → 明确 429（2026-10-26）=====
    # 用 map + return，而不是 iptables DROP：DROP 表现为"连接超时"，
    # 与网络故障无法区分；429 带可识别文本，用户和运维都能立刻判断。
    if ($qtvq_blocked) {
        return 429 "qtvq_blocked: rate limit or security rule triggered. If this is a mistake, email qtvq@qtvq.cn with the time and your IP. (blocked-429)";
    }

    # ===== QTVQ HARDENING (managed by deploy/hardening/install.sh) =====
    # Q问 站点安全片段 —— **放进 server { … } 内部**（由 install.sh 自动插入）
    #
    # 安装脚本会在 `location / {` 之前插入本段，先备份、再 `nginx -t`，通过后才 reload。
    # 本文件单独存在的意义：让这段"改变线上行为"的配置**进版本库、可 review、可回滚**。

    # ── 恶意 UA（爬虫框架/扫描器/抓包逆向工具/空 UA）→ 断连 ──
    # 2026-10-11 事故修复：/v1/admin/ 由 X-Admin-Key 鉴权，**不再做 UA 拦截**。
    # 原因：Cloudflare Workers 的 fetch() 默认不带 User-Agent → 入账请求被这里的 444
    # 静默断连（Node 侧连日志都没有），表现为"订单已 paid、钱包永不加钱"，排查极久。
    # 用标志位而非嵌套 if（nginx 不允许嵌套 if）。
    if ($qtvq_bad_ua) {
        set $qtvq_ua_block 1;
    }
    # 带密钥的 E2E UA 豁免「恶意 UA」这一条（见 conf.d/qtvq-e2e-ua.conf）。
    # 必须写在上面那条之后：下面这条会把它覆盖回 0。
    if ($qtvq_e2e) {
        set $qtvq_ua_block 0;
    }
    if ($request_uri ~ ^/v1/admin/) {
        set $qtvq_ua_block 0;
    }
    if ($qtvq_ua_block = 1) {
        return 444;
    }

    # ── 自称搜索引擎但 IP 不在官方白名单 → 断连（防拿白名单 UA 伪装）──
    if ($qtvq_fake_crawler) {
        return 444;
    }

    # ── 蜜罐路径（.git/.env/wp-admin/phpmyadmin/actuator…）→ 断连 ──
    # 2026-10-11：蜜罐规则**不作用于已鉴权的内部路径**。
    # 起因：Cloudflare 出口 IP 104.22.193.69 被 honeypot jail 封禁，而它正是
    # Pages 发往 /v1/admin/users/*/credit 的入账调用来源之一 —— 一旦被封，
    # 入账会再次静默失败（与当天"空 UA 被 444"是同一类事故）。
    # /v1/admin/ 有 X-Admin-Key、/v1/wallet/ 有 JWT，不依赖蜜罐来防扫描器。
    if ($qtvq_honeypot) {
        set $qtvq_hp_block 1;
    }
    if ($request_uri ~ ^/v1/(admin|wallet)) {
        set $qtvq_hp_block 0;
    }
    if ($qtvq_hp_block = 1) {
        return 444;
    }

    # ── 饱和攻击防护 ──
    limit_conn qtvq_conn 40;

    # ── 隐藏版本号、限制请求体 ──
    # 2m 的依据：本项目最大的上传是语音识别（base64 音频，服务端上限 512KB，
    # base64 膨胀 4/3 ≈ 683KB，留足余量）。再大的一律拒绝，防止用大 body 打满连接。
    server_tokens off;
    client_max_body_size 2m;

    # ── 隐藏文件与备份文件一律不可访问 ──
    location ~ /\.(?!well-known) {
        return 444;
    }
    location ~* \.(bak|sql|tar|tgz|zip|old|orig|save|swp)$ {
        return 444;
    }

    # ── 接口限速（返回 429，供 fail2ban/告警统计；静态页不限速，避免连续翻页被误伤）──
    # ── /api/auth 与 /api/auth/me 已迁到本机 Node（2026-10-26）──────────────
    #
    # 只精确匹配这两个路径：`/api/auth/sms`、`/api/auth/wechat*`、`/api/auth/delete`
    # 仍走 Pages（依赖短信/微信 SDK 与通知邮件）。它们签发的会话通过
    # `/v1/admin/auth-sessions` 写进境内 Mongo，与这里共享同一份会话。
    #
    # nginx 的匹配优先级：`location =` 精确匹配优先于 `^~` 前缀匹配，
    # 所以这两条写在 `/api/auth/` 之前即可生效。
    location = /api/auth {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location = /api/auth/me {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    location ^~ /api/auth/ {
        limit_req zone=qtvq_auth burst=10 nodelay;
        # 只走 IPv4：本机无 IPv6 路由，解析出 IPv6 会先白等一轮（日志 Network is unreachable）
        resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
        set $qtvq_api_upstream qtvq-api.pages.dev;
        proxy_pass https://qtvq_api_edge;
        proxy_set_header Connection "";
        proxy_ssl_name qtvq-api.pages.dev;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host qtvq-api.pages.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /api/payment/ {
        limit_req zone=qtvq_dyn burst=20 nodelay;
        # 只走 IPv4：本机无 IPv6 路由，解析出 IPv6 会先白等一轮（日志 Network is unreachable）
        resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
        set $qtvq_api_upstream qtvq-api.pages.dev;
        proxy_pass https://qtvq_api_edge;
        proxy_set_header Connection "";
        proxy_ssl_name qtvq-api.pages.dev;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host qtvq-api.pages.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    # ===== QTVQ HARDENING END =====

    location / {
        try_files $uri $uri/ =404;
    }

    # /api/ 反代到 Cloudflare Pages —— 国内直连 Pages 经常超过前端 8 秒超时，
    # 走同源（阿里云 -> Pages）后前端不再报「API 不可用且无备份」
    # ===== /api/speech 迁到自建 Node（2026-10-11，strangler 迁移第一步）=====
    # 回滚：删掉本段 + nginx -t && sudo systemctl reload nginx（秒级）
    # 为什么只切这一个：它不查额度、不碰 KV、不写库，是干净的一个变量。
    # 注意 proxy_pass 不带路径，URI 原样透传（Node 侧就挂在 /api/speech）。
    # ===== 静态资源缓存策略（js/css）=====
# 2026-10-26 重写：此前是"一律 no-cache + must-revalidate"，并额外发一条
# `Clear-Site-Data: "cache"`（让浏览器清空本站缓存）—— 那是 2026-10-11 为对付
# "业务方浏览器长期命中旧缓存、改了看不到" 而加的**临时**手段，配置里自己就写着
# "确认生效后应移除本行"。
#
# 但 `?v=<hash>` 指纹（tools/scripts/package-static.ps1 生成）上线后，这个手段
# 已经从"救急"变成"拖累"：每次导航都强制重传 CSS/JS（实测 gzip 19.1 KB/次）。
#
# 现在的判据（map 定义在 conf.d/qtvq-cache.conf）：
#   · 带 `v=` → `public, max-age=31536000, immutable`（内容变了 URL 就变，可永久缓存）
#   · 不带 `v=` → 仍 `no-cache, must-revalidate`（手工调试与旧链接照旧安全）
# ETag 保留：不带指纹的请求未变更时仍可 304。
location ~* ^/(js|css)/ {
        add_header Cache-Control $qtvq_static_cache always;
        etag on;
    }

    location = /api/speech {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # ===== /api/app/bootstrap 迁到自建 Node（2026-10-11，闸门全绿后才切）=====
    # 回滚：删掉本段 + nginx -t && sudo systemctl reload nginx（秒级）
    # 切流前提：`tools/scripts/check-app-bootstrap-gate.mjs` **双端逐字段全绿**（通过 33 / 失败 0）
    # —— 能力清单一旦算错，小程序支付/登录/钱包等入口会凭空消失而日志全绿。
    location = /api/app/bootstrap {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── /api/chat 与 /api/quota 已迁到本机 Node（2026-10-26）───────────────
    #
    # 为什么不继续走 Pages：这两个接口跑在 Cloudflare Pages Functions 上，
    # 客户端每次调用都要跨境。实测 P50 641ms / P95 6.7s（最坏 30.6s），
    # 而本机 /v1/* 是 P95 16ms。额度与订阅已迁到境内 Mongo（client_quota），
    # Node 是唯一写入方，所以这里可以直接切。
    #
    # 用 `location =` 精确匹配：不要影响 /api/chat/xxx 之类（不存在）与其它 /api/*。
    location = /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 模型链路可能重试多个提供方，给足读取时间（与 Pages 版一致的量级）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/quota {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── /api/contact 已迁到本机 Node（2026-10-26）──────────────────────────
    # 留言只写境内 Mongo + 境内 SMTP 通知，不再跨境。邮件通道用 node:tls 直连，
    # 不引第三方依赖；发信失败不影响留言落库（客服仍能在运营台看到）。
    location = /api/contact {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 含 base64 图片的留言可能较大；与 Pages 侧一致给 1MB+
        client_max_body_size 6m;
        proxy_read_timeout 30s;
    }

    location /api/ {
        # 只走 IPv4：本机无 IPv6 路由，解析出 IPv6 会先白等一轮（日志 Network is unreachable）
        resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
        set $qtvq_api_upstream qtvq-api.pages.dev;
        proxy_pass https://qtvq_api_edge;
        proxy_set_header Connection "";
        proxy_ssl_name qtvq-api.pages.dev;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host qtvq-api.pages.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qtvq.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qtvq.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



    # 配对报告服务（Node, 127.0.0.1:3000）
    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 生成报告要跑 1000+ token，默认 60s 会 502
        proxy_read_timeout 30s;
        proxy_send_timeout 120s;
    }
    # ===== 直播联调（家庭服务器 SRS，经隧道 127.0.0.1:9082）=====
    location = /livetest { return 301 /livetest/; }
    location = /live-test { return 301 /livetest/; }
    location = /zhibo { return 301 /liveboard/; }
    location ~ "^/liveapi/rooms/([a-f0-9]{24})/playtoken$" {
        proxy_pass http://127.0.0.1:9083/api/v1/rooms/$1/playtoken;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        add_header Access-Control-Allow-Origin * always;
    }
    location ^~ /livetest/ {
        charset utf-8;
        alias /var/www/livetest/;
        index index.html;
    }
    location ^~ /liveassets/ {
        proxy_pass http://127.0.0.1:9082/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location ^~ /live/ {
        proxy_pass http://127.0.0.1:9082/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Access-Control-Allow-Origin * always;
    }
    # ===== 全国直播预告与观看目录 =====
    location = /liveboard { return 301 /liveboard/; }
    location ^~ /liveboard/ {
        alias /var/www/liveboard/;
        index index.html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }
}
server {
    if ($host = www.qtvq.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = qtvq.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name qtvq.cn www.qtvq.cn;
    return 404; # managed by Certbot




    # ===== 直播联调（家庭服务器 SRS，经隧道 127.0.0.1:9082）=====
    location = /livetest { return 301 /livetest/; }
    location = /live-test { return 301 /livetest/; }
    location = /zhibo { return 301 /liveboard/; }
    location ^~ /livetest/ {
        charset utf-8;
        alias /var/www/livetest/;
        index index.html;
    }
    location ^~ /liveassets/ {
        proxy_pass http://127.0.0.1:9082/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location ^~ /live/ {
        proxy_pass http://127.0.0.1:9082/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Access-Control-Allow-Origin * always;
    }
    # ===== 全国直播预告与观看目录 =====
    location = /liveboard { return 301 /liveboard/; }
    location ^~ /liveboard/ {
        alias /var/www/liveboard/;
        index index.html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }
}
