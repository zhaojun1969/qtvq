# 静态资源缓存策略（2026-10-26）
#
# 背景：HTML 里 css/js 早已带版本指纹（`?v=0ab51418`，由 tools/scripts/package-static.ps1 生成），
# 但 nginx 一律回 `no-cache, must-revalidate` —— 每次导航都要逐文件回源校验，
# 再叠加一条 `Clear-Site-Data: "cache"`（会让浏览器**清空**本站缓存），
# 实际效果是**每次访问都完整重传 CSS/JS**（实测 gzip 后 19.1 KB/次）。
#
# 判据：URL 里带 `v=` 说明内容变了 URL 就会变 → 可以放心长缓存并标记 immutable；
#       不带指纹的（手工调试、旧链接）仍每次校验，避免"改了看不到"。
#
# 用法：本文件装到 /etc/nginx/conf.d/qtvq-cache.conf（http 上下文），
#       站点 server 块里的 `location ~* ^/(js|css)/` 引用 $qtvq_static_cache。
map $arg_v $qtvq_static_cache {
    default "public, max-age=31536000, immutable";
    ""      "no-cache, must-revalidate";
}
