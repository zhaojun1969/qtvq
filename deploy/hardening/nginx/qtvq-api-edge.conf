# Q问 —— `/api/` 反代到 Cloudflare Pages 的"边缘 IP 池"
#
# ── 为什么需要这个文件（2026-10-11 实测，别再删）─────────────────────────────
# `qtvq-api.pages.dev` 的 DNS **只返回两个 IPv4**：172.66.44.129、172.66.47.127。
# 这两个 IP 从本站 ECS（阿里云 47.115.214.130）出发，**ICMP 能通但 HTTPS 完全不通**
# （curl --resolve 实测 10s 超时，HTTP 000）；而其他 Cloudflare 任意播 IP 却正常：
#     172.64.80.1      → HTTP 200  0.69s
#     162.159.141.229  → HTTP 200  0.76s
#     104.18.32.128    → HTTP 200  1.12s
#     104.18.33.128    → HTTP 200  1.51s
#     172.64.81.1      → HTTP 200  2.13s
# 症状就是线上页面/接口**随机挂死到 60s 超时**、nginx 返回错误页 HTML
# （前端拿到的不是 JSON → 测试套件报 `SyntaxError: Unexpected token '<'`）。
#
# 结论：**不能依赖 pages.dev 的 DNS 解析结果**，必须自己维护一个已验证可达的边缘 IP 池。
# Cloudflare 是任意播，任意合法边缘 IP 都能服务本 zone（上面各 IP 返回的确实是我们的 200）。
#
# ── 维护方式 ───────────────────────────────────────────────────────────────
# 在 ECS 上跑（能直连的才留下）：
#   for ip in 172.64.80.1 162.159.141.229 104.18.32.128 104.18.33.128 172.64.81.1; do \
#     echo -n "$ip → "; \
#     curl -sS -o /dev/null -w '%{http_code} %{time_total}s\n' --max-time 8 \
#       --resolve qtvq-api.pages.dev:443:$ip https://qtvq-api.pages.dev/api/health; \
#   done
# 只把返回 200 的写进下面的 upstream。`max_fails`/`fail_timeout` 会让坏 IP 在 30s 内被摘掉，
# `proxy_next_upstream` 让它自动切到下一个 —— 所以池子里留几个是安全的。
upstream qtvq_api_edge {
    least_conn;
    server 172.64.80.1:443       max_fails=2 fail_timeout=30s;
    server 162.159.141.229:443   max_fails=2 fail_timeout=30s;
    server 104.18.32.128:443     max_fails=2 fail_timeout=30s;
    server 104.18.33.128:443     max_fails=2 fail_timeout=30s;
    server 172.64.81.1:443       max_fails=2 fail_timeout=30s;

    # 复用连接：跨国 TLS 握手很贵，keepalive 能显著降低 P50
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 200;
}

# ── 必读：keepalive 需要配合 `proxy_set_header Connection "";` ───────────────
# 2026-10-26 实测：这里虽然写了 `keepalive 32`，但站点配置里**没有**清空 Connection 头，
# 于是 nginx 仍向每个请求发 `Connection: close`，连接不复用 ——
# `ss -tn | grep :443 | grep -c ESTAB` 长期为 **0**，等于每个 API 请求都在跨境重做一次 TLS 握手。
# 补上 `proxy_set_header Connection "";`（在 sites-enabled/qtvq 的三处 /api/ location 里）后：
#   · ESTAB 连接数 0 → 11
#   · 源站侧 P50 1599ms → 296ms
# 只加 keepalive 不加这一行是**无效**的，别再踩一次。