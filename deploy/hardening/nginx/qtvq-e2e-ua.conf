# E2E 自动化测试的 UA 白名单（模板 —— **不含令牌**）
#
# 这份是仓库模板，装到 /etc/nginx/conf.d/qtvq-e2e-ua.conf。
# 线上那份里会多一行带令牌的正则；**令牌只存在于服务器**，不进仓库。
#
# ── 为什么需要它 ──────────────────────────────────────────────────────────────
# headless Chrome 的默认 UA 含 "HeadlessChrome"，会被本站的恶意 UA 规则判定为爬虫：
#   · 直接 444（断连）；
#   · 蜜罐 jail 累计 5 次 → 封禁 6 小时。
# 于是"Playwright 跑端到端测试"这条路会被自家防护挡死。而若为了跑测试关掉防护，
# 测出来的结果就没有说服力 —— 那不是测线上真实行为。
#
# ── 做法 ─────────────────────────────────────────────────────────────────────
# 给自动化测试一个**带密钥的 UA**：`QTVQ-E2E-<token>`。
# 它只豁免"恶意 UA"这一条规则；蜜罐路径、限流、隐藏文件、封禁名单**全部照旧**。
# 纵深防御没有被削弱（已验证：带令牌的 UA 访问 /wp-login.php 仍然 444）。
#
# ── 生成 / 轮换令牌（在服务器上执行）─────────────────────────────────────────
#   TOKEN=$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 32)
#   sed -i "s|^    \"~\\*QTVQ-E2E-.*|    \"~*QTVQ-E2E-$TOKEN\" 1;|" /etc/nginx/conf.d/qtvq-e2e-ua.conf
#   grep -q "QTVQ-E2E-" /etc/nginx/conf.d/qtvq-e2e-ua.conf || \
#     sed -i "s|^    default 0;|    default 0;\n    \"~*QTVQ-E2E-$TOKEN\" 1;|" /etc/nginx/conf.d/qtvq-e2e-ua.conf
#   nginx -t && nginx -s reload
#
# ── 测试侧用法 ───────────────────────────────────────────────────────────────
#   Playwright:  browser.newContext({ userAgent: `... HeadlessChrome/... QTVQ-E2E-${token}` })
#   Puppeteer:   page.setUserAgent(`... QTVQ-E2E-${token}`)
#   curl:        -A "Mozilla/5.0 HeadlessChrome/155.0.0.0 QTVQ-E2E-$TOKEN"
#
# 注意：`-A` 里必须**保留**原始 headless UA 的关键片段也不必 —— 只要整串包含
# `QTVQ-E2E-<token>` 即匹配（正则 `~*` 不区分大小写）。

map $http_user_agent $qtvq_e2e {
    default 0;
    # 令牌行由运维在服务器上追加；仓库模板刻意只留 default 0（全拒）。
}
