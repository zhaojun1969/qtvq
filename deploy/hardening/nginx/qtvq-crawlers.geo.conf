# 搜索引擎官方 IP 白名单（geo 指令），由 tools/scripts/sync-crawler-ips.mjs 生成
#
# 为什么用白名单而不是每次请求做 rDNS：
#   nginx 无法在请求路径上做反向 DNS；把 DNS 查询放进每请求链路会拖慢线上、
#   并且让上游 DNS 的抖动直接影响可用性。工业做法是**定期同步官方发布名单**：
#     · Google：https://developers.google.com/static/search/apis/ipranges/googlebot.json
#     · Baidu/Yandex 等：官方帮助页公布的网段（人工确认后写入本文件）
#   自称爬虫却不在名单里的请求 → 444。
#
# ⚠️ 本文件必须**始终包含 default 0**（默认"不是已认证爬虫"），
#    否则 map/geo 的默认值行为会与预期相反，把真爬虫和伪装者一起放行或一起拦掉。
#
# 当前内容为**初始手工名单**（阿里云/百度/Google 常用段）。首次部署后请运行：
#   node tools/scripts/sync-crawler-ips.mjs --write
# 用官方数据覆盖本节，并 reload nginx。

geo $qtvq_crawler_ok {
    default 0;

    # IPv4 本地/内网（监控、健康检查）
    127.0.0.1/32 1;
    10.0.0.0/8   1;

    # ---- Google (auto-generated) ----
    # 由 tools/scripts/sync-crawler-ips.mjs --write 从 Google 官方 googlebot.json 覆盖本节。
    # 手工改动会被下次同步覆盖 —— 要长期保留的段请写在标记之外的区域。
    66.249.64.0/19    1;
    66.249.66.0/23    1;
    66.249.68.0/22    1;
    66.249.72.0/21    1;
    66.249.80.0/20    1;
    # ---- end Google ----

    # ---- Bing / Microsoft ----
    40.77.167.0/24  1;
    157.55.39.0/24  1;
    207.46.13.0/24  1;
    13.66.139.0/24  1;
    20.15.133.160/27 1;

    # ---- 百度（官方公布的爬虫段之一部分；完整列表需按官方页面核对）----
    220.181.108.0/22 1;
    123.125.71.0/24  1;
    180.76.15.0/24   1;
    111.206.221.0/24 1;
    182.61.200.0/22  1;

    # ---- 360 / 神马（按官方公布段补充；未确认前不放进白名单，宁可让它被拦）----
    # 说明：360 与神马的官方 IP 列表不公开稳定，因此**刻意留空**——
    # 不在白名单的"自称 360Spider/神马"会被 444。若发现收录受影响，
    # 从 access log 里取其真实 IP，核对后手工加段到本文件。
}
