# Q问 站点安全片段 —— **放进 server { … } 内部**（由 install.sh 自动插入）
#
# 安装脚本会在 `location / {` 之前插入本段，先备份、再 `nginx -t`，通过后才 reload。
# 本文件单独存在的意义：让这段"改变线上行为"的配置**进版本库、可 review、可回滚**。

# ── 已被 fail2ban 封禁 → 明确 429（2026-10-26）──
#
# 为什么不是 iptables DROP：DROP 让客户端看到"连接超时"，与网络故障无法区分 ——
# 用户只会说"网站打不开"，运维也容易误判方向（2026-10-26 就因此误判了一轮）。
# 429 带可识别文本，用户知道该找谁，运维一眼能判断"是被封不是挂了"。
#
# 名单由 /usr/local/bin/qtvq-blocklist-sync 每 60 秒从 fail2ban 同步到
# /etc/nginx/blacklisted-sessions.map（map 定义见 nginx/qtvq-blockmap.conf）。
if ($qtvq_blocked) {
    return 429 "qtvq_blocked: rate limit or security rule triggered. If this is a mistake, email qtvq@qtvq.cn with the time and your IP. (blocked-429)";
}

# ── 恶意 UA（爬虫框架/扫描器/抓包逆向工具/空 UA）→ 断连 ──
#
# 例外：带密钥的 E2E UA（`QTVQ-E2E-<token>`）放行。
# 原因：headless Chrome 默认 UA 含 "HeadlessChrome"，会被这条规则判为爬虫 →
# 端到端测试（Playwright/Puppeteer）根本跑不起来；为跑测试而关掉防护，
# 测出来的结果就没有意义。令牌只存在于服务器（conf.d/qtvq-e2e-ua.conf），不进仓库。
# 注意顺序：这一条必须写在下面那条 `if` **之后**，因为它要把 $qtvq_bad_ua 的判定覆盖回 0。
if ($qtvq_e2e) {
    set $qtvq_ua_block 0;
}
if ($qtvq_bad_ua) {
    return 444;
}

# ── 自称搜索引擎但 IP 不在官方白名单 → 断连（防拿白名单 UA 伪装）──
if ($qtvq_fake_crawler) {
    return 444;
}

# ── 蜜罐路径（.git/.env/wp-admin/phpmyadmin/actuator…）→ 断连 ──
if ($qtvq_honeypot) {
    return 444;
}

# ── 饱和攻击防护 ──
limit_conn qtvq_conn 40;

# ── 隐藏版本号、限制请求体 ──
# 2m 的依据：本项目最大的上传是语音识别（base64 音频，服务端上限 512KB，
# base64 膨胀 4/3 ≈ 683KB，留足余量）。再大的一律拒绝，防止用大 body 打满连接。
server_tokens off;
client_max_body_size 2m;

# ── 分享短链 /r/<token> → 静态落地页 r.html?t=<token>（2026-10-27，实施书 P2-T2.4）──
#
# 为什么用 rewrite 而不是别处定义：短链必须和分享卡上的二维码、分享接口返回的 shortPath
# 三处完全一致；写在 nginx 是唯一能保证「卡片印什么、浏览器访问什么」同一处定义的地方。
# token 字符集与 server/src/routes/report.js 里 `/^[A-Za-z0-9_-]{12,64}$/` 对齐，其余一律 404/不改写，
# 不给扫描器留探测面（不要改成 `(.*)`，否则 /r/../../ 之类也会被送进页面）。
# `last` 让重写后的 /r.html 重新走 location 匹配，静态文件与 ?v= 缓存策略照常生效。
rewrite ^/r/([A-Za-z0-9_-]{12,64})/?$ /r.html?t=$1 last;

# ── 隐藏文件与备份文件一律不可访问 ──
location ~ /\.(?!well-known) {
    return 444;
}
location ~* \.(bak|sql|tar|tgz|zip|old|orig|save|swp)$ {
    return 444;
}

# ── 接口限速（返回 429，供 fail2ban/告警统计；静态页不限速，避免连续翻页被误伤）──
location ^~ /api/auth/ {
    limit_req zone=qtvq_auth burst=10 nodelay;
    proxy_pass https://qtvq-api.pages.dev;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host qtvq-api.pages.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /api/payment/ {
    limit_req zone=qtvq_dyn burst=20 nodelay;
    proxy_pass https://qtvq-api.pages.dev;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host qtvq-api.pages.dev;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
